<aside class="fixed left-0 top-0 h-full w-64 bg-gray-900 border-r border-gray-800 p-4 overflow-y-auto">
    <div class="mb-8">
        <h1 class="text-xl font-bold text-emerald-400">Moncloa-AI</h1>
        <p class="text-xs text-gray-500">Consejo de Ministros Autónomo</p>
    </div>
    <nav class="space-y-2">
        <a href="/" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
            Dashboard
        </a>
        <a href="/historial" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Historial
        </a>
        <a href="/reglas" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            Reglas
        </a>
        <a href="/configurar" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-gray-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Configurar
        </a>
    </nav>
    <div class="mt-8 pt-4 border-t border-gray-800">
        <div class="flex items-center gap-2 mb-2" id="status-indicator">
            <span class="w-2 h-2 rounded-full
                {% if engine_status == 'running' %}bg-green-500
                {% elif engine_status == 'paused' %}bg-yellow-500
                {% else %}bg-gray-500{% endif %}" id="status-dot"></span>
            <span class="text-sm text-gray-400" id="status-text">{{ engine_status or 'idle' }}</span>
        </div>
        <div class="flex gap-2">
            <button onclick="fetch('/api/loop/pause', {method:'POST'}).then(()=>location.reload())"
                    class="text-xs px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-yellow-400">Pausar</button>
            <button onclick="fetch('/api/loop/resume', {method:'POST'}).then(()=>location.reload())"
                    class="text-xs px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-green-400">Reanudar</button>
        </div>
    </div>
</aside>
