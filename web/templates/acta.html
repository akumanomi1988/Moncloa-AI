{% extends "base.html" %}
{% block title %}Acta - Moncloa-AI{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Acta del Consejo</h2>
        <a href="javascript:window.print()" class="text-sm bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded">Imprimir</a>
    </div>
    <div class="bg-gray-900 p-6 rounded-lg border border-gray-800 prose prose-invert">
        {{ acta|replace('\n', '<br>')|safe }}
    </div>
</div>
{% endblock %}
